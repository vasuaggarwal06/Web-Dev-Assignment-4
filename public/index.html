<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secure Connect Chat</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      input,
      button {
        padding: 0.5rem;
        margin: 0.25rem 0;
      }
      #log {
        border: 1px solid #ccc;
        height: 280px;
        overflow-y: auto;
        padding: 0.5rem;
        margin: 0.5rem 0;
      }
      .note {
        color: #888;
        font-style: italic;
      }
      .row {
        display: flex;
        gap: 0.5rem;
      }
      .row input {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <h2>Secure Connect Chat</h2>
    <div id="login">
      <input id="email" placeholder="email" />
      <input id="password" type="password" placeholder="password" />
      <button id="loginBtn">Login</button> <span id="status"></span>
    </div>
    <div id="chat" hidden>
      <div>
        Room: <input id="room" value="general" />
        <button id="joinBtn">Join</button>
      </div>
      <div id="log"></div>
      <div id="typing" class="note" style="height: 1.4em"></div>
      <div class="row">
        <input id="msg" placeholder="Type a message" /><button id="send">
          Send
        </button>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let socket,
        currentRoom = "general",
        typingTimer,
        lastTyping = 0;
      const add = (t, cls) => {
        const d = document.createElement("div");
        d.textContent = t;
        if (cls) d.className = cls;
        $("log").appendChild(d);
        $("log").scrollTop = 1e9;
      };

      $("loginBtn").onclick = async () => {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: $("email").value,
            password: $("password").value,
          }),
        });
        const data = await res.json();
        $("status").textContent = data.message;
        if (!res.ok) return;
        socket = io({ auth: { token: data.token } });
        socket.on("message", (m) =>
          add(`[${m.room}] ${m.username}: ${m.text}`),
        );
        socket.on("history", (h) =>
          h.forEach((m) => add(`[${m.room}] ${m.username}: ${m.text}`)),
        );
        socket.on("notification", (t) => add(t, "note"));
        socket.on("typing", (u) => {
          $("typing").textContent = `${u} is typing...`;
          clearTimeout(typingTimer);
          typingTimer = setTimeout(() => ($("typing").textContent = ""), 1500);
        });
        socket.on(
          "connect_error",
          (e) => ($("status").textContent = e.message),
        );
        $("login").hidden = true;
        $("chat").hidden = false;
        socket.emit("joinRoom", currentRoom);
      };
      $("joinBtn").onclick = () => {
        currentRoom = $("room").value || "general";
        $("log").innerHTML = "";
        socket.emit("joinRoom", currentRoom);
      };
      $("send").onclick = () => {
        socket.emit("chatMessage", { room: currentRoom, text: $("msg").value });
        $("msg").value = "";
      };
      $("msg").addEventListener("keydown", (e) => {
        if (e.key === "Enter") return $("send").click();
        const now = Date.now();
        if (now - lastTyping > 1000) {
          lastTyping = now;
          socket.emit("typing", currentRoom);
        }
      });
    </script>
  </body>
</html>
